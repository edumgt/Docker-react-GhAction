services:
  # ── MariaDB ──────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: canvasdb
      MYSQL_USER: canvasuser
      MYSQL_PASSWORD: canvaspass
    command: --max-allowed-packet=64M
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── App (Python FastAPI) ─────────────────────────────────────────
  # Ollama runs on the host — reachable via host.docker.internal:11434
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: canvasuser
      DB_PASSWORD: canvaspass
      DB_NAME: canvasdb
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-in-production-use-a-long-random-string}"
      OLLAMA_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
